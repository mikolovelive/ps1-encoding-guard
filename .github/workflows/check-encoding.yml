name: Encoding guard

# The bug this detector finds is specific to Windows PowerShell 5.1, so the
# windows-latest job is the authoritative check. The linux job confirms the
# script and its tests stay cross-platform.
#
# ---------------------------------------------------------------------------
# Two CI rules are baked into every step below:
#
# 1. A step that runs a script must END with an explicit `exit 0`.
#    GitHub executes `shell: powershell` steps as:
#        powershell -command ". 'step.ps1'"
#    Because the step is dot-sourced, any leftover non-zero $LASTEXITCODE from
#    a call inside the step can surface as the step's exit code and turn a
#    passing step red. Ending with `exit 0` makes the result depend only on
#    our own assertions.
#
# 2. run-tests.ps1 never calls `exit`; it throws on failure. That keeps it
#    safe to invoke from a dot-sourced step. fix-ps1-encoding.ps1 DOES use
#    `exit` — that is its public contract as a lint tool — so its code is
#    read from $LASTEXITCODE and then neutralised by rule 1.
#
# Cross-platform note: `$env:TEMP` only exists on Windows.
# Use [System.IO.Path]::GetTempPath() everywhere.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Authoritative: Windows PowerShell 5.1
  # ---------------------------------------------------------------
  windows-ps5:
    name: Windows PowerShell 5.1 (authoritative)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show parser version and environment
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          Write-Host "ErrorActionPreference = $ErrorActionPreference"
          Write-Host "TempPath = $([System.IO.Path]::GetTempPath())"
          exit 0

      - name: Self-test (17 assertions)
        shell: powershell
        run: |
          # run-tests.ps1 throws on failure and does not call `exit`, so a
          # thrown exception is what marks this step red.
          .\test\run-tests.ps1
          Write-Host 'Self-test passed.'
          exit 0

      - name: Scan repo for unencoded scripts (expect clean)
        shell: powershell
        run: |
          .\fix-ps1-encoding.ps1 -Path . -Json
          $code = $LASTEXITCODE
          Write-Host "guard exit code = $code"
          if ($code -ne 0) { throw "Expected a clean scan (exit 0), got $code" }
          Write-Host 'Scan clean.'
          exit 0

      - name: Prove -Apply is a no-op on a clean tree
        shell: powershell
        run: |
          .\fix-ps1-encoding.ps1 -Path . -Apply -Json
          $code = $LASTEXITCODE
          Write-Host "guard exit code = $code"
          if ($code -ne 0) { throw "Expected exit 0 after -Apply, got $code" }

          # `git status --porcelain` returns an array; a non-empty array is
          # truthy, so count the entries instead.
          $changes = @(git status --porcelain)
          if ($changes.Count -gt 0) {
            Write-Host 'Unexpected working-tree changes:'
            git --no-pager diff
            throw "git status is not clean after -Apply ($($changes.Count) entries)"
          }
          Write-Host 'Working tree still clean.'
          exit 0

      - name: Detect a deliberately broken fixture
        shell: powershell
        run: |
          Write-Host "TempPath = $([System.IO.Path]::GetTempPath())"

          $dir = Join-Path ([System.IO.Path]::GetTempPath()) 'broken-fixture'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $file = Join-Path $dir 'needs-bom.ps1'
          $text = "# " + [char]0x4E2D + [char]0x6587 + "`nWrite-Host 'hi'`n"

          # UTF-8 WITHOUT a BOM on purpose — that is the condition we detect.
          [System.IO.File]::WriteAllText($file, $text, (New-Object System.Text.UTF8Encoding($false)))

          $bytes = [System.IO.File]::ReadAllBytes($file)
          $nonAscii = ($bytes | Where-Object { $_ -gt 127 }).Count
          Write-Host "fixture : $file"
          Write-Host "bytes   : $($bytes.Length)   non-ASCII bytes: $nonAscii"
          if ($bytes.Length -lt 3 -or $nonAscii -eq 0) {
            throw 'Fixture was not written as expected (no non-ASCII content).'
          }

          .\fix-ps1-encoding.ps1 -Path $dir -Json
          $code = $LASTEXITCODE
          Write-Host "guard exit code = $code"
          if ($code -ne 1) { throw "Expected exit 1 (findings present), got $code" }
          Write-Host 'Correctly flagged the unencoded fixture.'
          exit 0

  # ---------------------------------------------------------------
  # Compatibility: PowerShell 7 on Linux
  # ---------------------------------------------------------------
  linux-pwsh7:
    name: Linux PowerShell 7 (compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show parser version and environment
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          Write-Host "ErrorActionPreference = $ErrorActionPreference"
          Write-Host "TempPath = $([System.IO.Path]::GetTempPath())"
          exit 0

      - name: Self-test (17 assertions)
        shell: pwsh
        run: |
          # run-tests.ps1 throws on failure and does not call `exit`.
          ./test/run-tests.ps1
          Write-Host 'Self-test passed.'
          exit 0

      - name: Repo scan runs and the tool detects a broken fixture
        shell: pwsh
        run: |
          # On PS7 the repo's own files parse fine, so a clean scan (exit 0)
          # is expected here.
          ./fix-ps1-encoding.ps1 -Path . -Json
          $repoCode = $LASTEXITCODE
          Write-Host "repo scan exit code = $repoCode"
          if ($repoCode -ne 0) { throw "Expected a clean repo scan, got $repoCode" }

          $dir = Join-Path ([System.IO.Path]::GetTempPath()) 'broken-fixture'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $file = Join-Path $dir 'needs-bom.ps1'
          $text = "# " + [char]0x4E2D + [char]0x6587 + "`nWrite-Host 'hi'`n"
          [System.IO.File]::WriteAllText($file, $text, (New-Object System.Text.UTF8Encoding($false)))

          ./fix-ps1-encoding.ps1 -Path $dir -Json
          $code = $LASTEXITCODE
          Write-Host "fixture scan exit code = $code"
          if ($code -ne 1) { throw "Expected exit 1 (findings present), got $code" }
          Write-Host 'Correctly flagged the unencoded fixture.'
          exit 0
